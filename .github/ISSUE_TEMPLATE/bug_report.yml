name: Bug report
description: Report a reproducible defect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove secrets, personal data, employer
        information, private endpoints, and confidential logs before submitting.
        Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or full commit SHA where the problem occurs.
      placeholder: v0.1.0 or 0123456789abcdef...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Container
        - Kubernetes
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what user or system impact did it have?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest synthetic example that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized evidence
      description: Include sanitized logs or traces and remove all credentials.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This report contains no secrets, personal data, or confidential material.
          required: true
        - label: This is not a vulnerability report requiring private disclosure.
          required: true
